applications:
  - name: my-n8n-platform
    memory: 4G
    disk_quota: 4G
    stack: cflinuxfs4
    routes:
      - route: ((app-host)).((app-domain))
    buildpacks:
      - nodejs_buildpack
    command: node index.js
    health-check-type: port
    timeout: 180
    env:
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      GENERIC_TIMEZONE: "Asia/Kolkata"
      N8N_ENCRYPTION_KEY: "UseAUniqueRandom32CharacterStringHere"
      DB_TYPE: sqlite
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
