applications:
  - name: my-n8n-platform
    memory: 2G
    disk_quota: 4G
    stack: cflinuxfs4
    random-route: false
    buildpacks:
      - nodejs_buildpack
    command: node index.js
    health-check-type: port
    timeout: 180
    env:
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      GENERIC_TIMEZONE: "Asia/Kolkata"
      N8N_ENCRYPTION_KEY: "UseAUniqueRandom32CharacterStringHere"
      N8N_ENDPOINT_HEALTH: "health"
      DB_TYPE: sqlite
      NODE_OPTIONS: "--max-old-space-size=1600"
      EXECUTIONS_PROCESS: "main"
